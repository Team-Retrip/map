spring:
  application:
    name: map
############# Data Source ######
  datasource:
    driver-class-name: org.h2.Driver
    #    url: jdbc:h2:mem:trip;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;MODE=MySQL
    url: jdbc:h2:tcp://localhost/~/map;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
############# Batch ############
  batch:
    job:
      name: "retrip-map"
      enabled: false
    jdbc:
      initialize-schema: always
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create

